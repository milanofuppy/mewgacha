<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ミュウガチャ</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="apple-mobile-web-app-title" content="ミュウガチャ">
<meta name="application-name" content="ミュウガチャ">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#f28fb8">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=Mochiy+Pop+One&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}img{max-width:100%}[hidden]{display:none!important}

/* Layout: ピンク〜ラベンダーの空に光の玉と種がふわふわ浮く背景。中央にキャラのメダル、下にガラス風の枠カード。左上クレジット、右上に音とカメラ */
:root{
  --sky-top:#fff0f7;
  --sky-bot:#f1e6ff;
  --pink:#f28fb8;
  --pink-deep:#d4588f;
  --pink-ink:#a83a6b;
  --lav:#b99cf2;
  --lav-soft:#efe5ff;
  --gold:#d1a645;
  --gold-soft:#f8ebc4;
  --ink:#57394a;
  --ink-soft:#977a8f;
  --line:#f6cfe0;
  --glass:rgba(255,255,255,.82);
  --none:#d6b9c9;
  --s-white:#f5f0f2; --s-white-ink:#6b5d63; --s-white-ball:#ffffff;
  --s-blue:#dcecfb; --s-blue-ink:#2f6aa3; --s-blue-ball:#5aa3e8;
  --s-gold:#f9e9b6; --s-gold-ink:#8a6413; --s-gold-ball:#f0c64a;
  --f-body:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;
  --f-pop:"Mochiy Pop One","Zen Maru Gothic",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{background:var(--sky-top)}
body{color:var(--ink);font-family:var(--f-body);font-weight:500;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 140px;background:linear-gradient(180deg,var(--sky-top) 0%,#fbe9f6 45%,var(--sky-bot) 100%) fixed}
#sky{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.wrap{position:relative;z-index:1;max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
button{font-family:inherit}

/* 上の固定ボタン */
.thanks{position:fixed;z-index:70;top:calc(10px + env(safe-area-inset-top,0px));left:max(10px,env(safe-area-inset-left,0px));
  font-size:.68rem;font-weight:700;color:var(--pink-ink);background:rgba(255,255,255,.9);border:1px solid var(--line);
  border-radius:999px;padding:6px 11px;box-shadow:0 2px 8px -3px rgba(212,88,143,.35);max-width:calc(100vw - 130px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.thanks a{color:var(--pink-deep);text-decoration:underline;text-underline-offset:2px}
.thanks a:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.topr{position:fixed;z-index:70;top:calc(6px + env(safe-area-inset-top,0px));right:max(10px,env(safe-area-inset-right,0px));display:flex;gap:8px}
.ibtn{appearance:none;width:42px;height:42px;border-radius:50%;border:2px solid #fff;background:linear-gradient(145deg,#fff,#ffe6f1);
  box-shadow:0 0 0 1.5px var(--pink),0 4px 10px -4px rgba(212,88,143,.6);display:grid;place-items:center;cursor:pointer;color:var(--pink-deep);padding:0}
.ibtn svg{width:22px;height:22px}
.ibtn.on{background:linear-gradient(145deg,var(--pink),var(--pink-deep));color:#fff}
.ibtn:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.ibtn[hidden]{display:none!important}

header{text-align:center;padding-top:62px;display:flex;flex-direction:column;align-items:center;gap:8px}
.ribbon{position:relative;display:inline-block;font-family:var(--f-pop);font-weight:400;font-size:1.25rem;margin:0;color:#fff;letter-spacing:.04em;
  background:linear-gradient(180deg,#f7a3c6 0%,var(--pink-deep) 100%);padding:8px 24px 9px;border-radius:8px;
  box-shadow:0 3px 0 var(--pink-ink),0 0 0 3px #fff,0 0 0 5px var(--gold),0 10px 24px -10px rgba(168,58,107,.7);text-shadow:0 2px 0 rgba(168,58,107,.5)}
.modebar{display:flex;align-items:center;gap:8px;font-size:.78rem;flex-wrap:wrap;justify-content:center}
.modechip{background:var(--glass);border:1.5px solid var(--pink);color:var(--pink-deep);font-weight:900;border-radius:999px;padding:3px 11px}
.linkbtn{appearance:none;background:none;border:none;font-weight:700;color:var(--pink-deep);text-decoration:underline;cursor:pointer;font-size:.78rem;padding:4px}
.hint{margin:0;color:var(--ink-soft);font-size:.8rem}

.stage{display:grid;place-items:center;padding:14px 0 6px}
.medal{position:relative;width:min(56vw,216px);aspect-ratio:1;max-width:100%;border-radius:50%;
  background:radial-gradient(circle at 50% 40%,#fff 0%,#fff3f9 50%,#f7d9ff 100%);
  box-shadow:0 0 0 4px #fff,0 0 0 7px var(--pink),0 0 0 9px #fff,0 0 0 10px var(--gold),0 18px 50px -12px rgba(185,156,242,.7);
  display:grid;place-items:center}
.medal::before{content:"";position:absolute;inset:-34px;border-radius:50%;z-index:-1;
  background:conic-gradient(from 0deg,rgba(242,143,184,.0),rgba(242,143,184,.45),rgba(185,156,242,.45),rgba(240,198,74,.35),rgba(242,143,184,.0));
  -webkit-mask:radial-gradient(circle,transparent 62%,#000 63%,#000 70%,transparent 71%);mask:radial-gradient(circle,transparent 62%,#000 63%,#000 70%,transparent 71%);
  animation:spin 9s linear infinite}
.medal::after{content:"";position:absolute;inset:-18px;border-radius:50%;z-index:-1;border:1.5px dashed rgba(185,156,242,.6);animation:spin 24s linear infinite reverse}
.medal img{width:76%;height:auto;filter:drop-shadow(0 6px 6px rgba(87,57,74,.15));animation:float 3.6s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-7px) rotate(-2deg)}}
@keyframes spin{to{transform:rotate(360deg)}}

.card{background:var(--glass);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border:1.5px solid rgba(255,255,255,.95);border-radius:22px;padding:14px;
  display:flex;flex-direction:column;gap:10px;box-shadow:0 0 0 1px var(--line),0 10px 28px -16px rgba(168,58,107,.45)}
.card h2{margin:0;font-size:.95rem;font-weight:900;display:flex;align-items:center;gap:8px;color:var(--pink-ink)}
.card h2::before{content:"";width:10px;height:10px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff,var(--pink) 60%,var(--lav));box-shadow:0 0 6px var(--pink)}
.card h2 small{margin-left:auto;font-weight:500;color:var(--ink-soft);font-size:.72rem}
.slots{display:grid;gap:8px}
.slots.ing{grid-template-columns:repeat(3,minmax(0,1fr))}
.slot{appearance:none;border:2px solid var(--line);background:rgba(255,255,255,.9);border-radius:16px;padding:8px 10px;text-align:left;cursor:pointer;
  color:inherit;display:flex;align-items:center;gap:10px;min-width:0;min-height:50px;transition:border-color .15s,background .15s,transform .15s;position:relative}
.slots.ing .slot{flex-direction:column;align-items:center;text-align:center;gap:4px;padding:8px 6px 10px}
.slot:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
body.mode-pick .slot:hover{border-color:var(--pink);transform:translateY(-1px)}
body.mode-pick .slot::after{content:"✎";position:absolute;top:4px;right:7px;font-size:.7rem;color:var(--pink)}
body.mode-all .slot{cursor:default}
.slot .lv{font-family:var(--f-pop);font-size:.7rem;color:#fff;background:linear-gradient(90deg,var(--pink),var(--lav));border-radius:999px;padding:2px 8px;white-space:nowrap;font-variant-numeric:tabular-nums}
.slot .val{font-weight:700;font-size:.92rem;min-width:0;overflow-wrap:anywhere;display:flex;flex-direction:column;align-items:center;gap:2px}
.slots.ing .val{font-size:.75rem;line-height:1.3}
.slot .val img{width:54px;height:54px;object-fit:contain;filter:drop-shadow(0 2px 2px rgba(87,57,74,.15))}
.slot .val.none{color:var(--none);font-size:1.2rem}
.slots.ing .val.none{height:74px;justify-content:center}
.slot.flash{animation:flash 1.1s ease}
@keyframes flash{0%{background:var(--gold-soft);box-shadow:0 0 0 5px rgba(240,198,74,.45)}100%{box-shadow:none}}
.slot.locked{opacity:.55}
.chip{border-radius:999px;padding:3px 10px;font-size:.86rem;font-weight:700;display:inline-flex;align-items:center;gap:6px}
.chip .dot{width:10px;height:10px;border-radius:50%;flex:none}
.chip.white{background:var(--s-white);color:var(--s-white-ink)} .chip.white .dot{background:var(--s-white-ball);box-shadow:inset 0 0 0 1.5px #cfc6ca}
.chip.blue{background:var(--s-blue);color:var(--s-blue-ink)} .chip.blue .dot{background:var(--s-blue-ball)}
.chip.gold{background:var(--s-gold);color:var(--s-gold-ink);box-shadow:inset 0 0 0 1px var(--gold)} .chip.gold .dot{background:var(--s-gold-ball)}

.learned{display:flex;flex-direction:column;gap:6px;border-top:1.5px dashed var(--line);padding-top:10px}
.learned .head{font-size:.75rem;color:var(--ink-soft);font-weight:700;display:flex;justify-content:space-between;gap:8px;font-variant-numeric:tabular-nums}
.learned ul{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:6px}
.lchip{appearance:none;font-size:.72rem;border-radius:999px;padding:4px 10px;background:rgba(255,255,255,.8);color:var(--none);border:1px solid var(--line);font-weight:500;cursor:default}
.lchip.got{background:linear-gradient(90deg,#ffe2ef,var(--lav-soft));color:var(--pink-deep);border-color:#f3c3dc;font-weight:700}
body.mode-pick .lchip{cursor:pointer}
.lchip:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

.resetrow{display:flex;justify-content:center}
.tbtn{appearance:none;border:1.5px solid var(--line);background:var(--glass);border-radius:999px;padding:8px 14px;font-weight:700;font-size:.8rem;color:var(--pink-ink);cursor:pointer}
.tbtn:hover{border-color:var(--pink)}
.tbtn:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

.bar{position:fixed;left:0;right:0;bottom:0;z-index:20;
  padding:14px max(16px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  background:linear-gradient(to top,rgba(241,230,255,.95) 60%,rgba(241,230,255,0));display:flex;justify-content:center}
.bar[hidden]{display:none!important}
.go{appearance:none;border:none;cursor:pointer;width:100%;max-width:560px;border-radius:999px;padding:16px 20px;position:relative;overflow:hidden;
  font-family:var(--f-pop);font-size:1.1rem;color:#fff;letter-spacing:.06em;
  background:linear-gradient(135deg,#f7a3c6 0%,var(--pink-deep) 60%,#a77ce6 100%);
  box-shadow:0 4px 0 var(--pink-ink),0 0 0 3px #fff,0 0 0 5px var(--gold),0 14px 30px -8px rgba(212,88,143,.7)}
.go::after{content:"";position:absolute;top:0;bottom:0;width:40%;left:-60%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);animation:shine 2.6s ease-in-out infinite}
@keyframes shine{60%,100%{left:120%}}
.go:active{transform:translateY(3px);box-shadow:0 1px 0 var(--pink-ink),0 0 0 3px #fff,0 0 0 5px var(--gold)}
.go:focus-visible{outline:3px solid var(--gold);outline-offset:6px}

/* モード選択 */
.modesel{position:fixed;inset:0;z-index:40;display:grid;place-items:center;overflow-y:auto;background:linear-gradient(180deg,rgba(255,240,247,.7),rgba(241,230,255,.75));
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  padding:calc(64px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.modesel[hidden]{display:none!important}
.modebox{width:100%;max-width:420px;display:flex;flex-direction:column;align-items:center;gap:16px;text-align:center}
.modebox img{width:130px;height:auto;animation:float 3.4s ease-in-out infinite;filter:drop-shadow(0 8px 10px rgba(185,156,242,.5))}
.modebox p{margin:0;color:var(--ink-soft);font-size:.85rem}
.mbtn{appearance:none;width:100%;border:2px solid #fff;background:var(--glass);border-radius:22px;padding:16px 18px;cursor:pointer;text-align:left;color:var(--ink);
  display:flex;flex-direction:column;gap:4px;box-shadow:0 0 0 1.5px var(--pink),0 10px 24px -14px rgba(168,58,107,.6)}
.mbtn b{font-family:var(--f-pop);font-weight:400;font-size:1.1rem;color:var(--pink-deep)}
.mbtn span{font-size:.8rem;color:var(--ink-soft)}
.mbtn:hover{background:#fff}
.mbtn:focus-visible{outline:3px solid var(--gold);outline-offset:3px}

/* 枠の設定シート */
.scrim{position:fixed;inset:0;z-index:45;background:rgba(87,57,74,.35)}
.scrim[hidden]{display:none!important}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:46;max-height:82vh;overflow-y:auto;background:linear-gradient(180deg,#fff 0%,#fff6fb 100%);
  border-radius:24px 24px 0 0;box-shadow:0 -10px 30px -10px rgba(168,58,107,.5);
  padding:18px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));animation:up .25s ease}
.sheet[hidden]{display:none!important}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.sheet-in{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.sheet h3{margin:0;font-family:var(--f-pop);font-weight:400;font-size:1.05rem;color:var(--pink-deep);text-align:center}
.sheet .sub{margin:-8px 0 0;text-align:center;font-size:.78rem;color:var(--ink-soft)}
.sgacha{appearance:none;border:none;border-radius:999px;padding:14px;font-family:var(--f-pop);font-size:1rem;color:#fff;cursor:pointer;
  background:linear-gradient(135deg,#f7a3c6 0%,var(--pink-deep) 60%,#a77ce6 100%);box-shadow:0 3px 0 var(--pink-ink),0 0 0 3px #fff,0 0 0 5px var(--gold)}
.sgacha:disabled{background:#e8d8e0;box-shadow:0 3px 0 #d8c3cd;cursor:default}
.sgacha:focus-visible{outline:3px solid var(--gold);outline-offset:5px}
.or{display:flex;align-items:center;gap:10px;font-size:.75rem;color:var(--ink-soft);font-weight:700}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.opts{display:grid;gap:8px;grid-template-columns:repeat(2,minmax(0,1fr))}
.opts.ing{grid-template-columns:repeat(4,minmax(0,1fr))}
.opt{appearance:none;border:1.5px solid var(--line);background:#fff;border-radius:14px;padding:8px;cursor:pointer;color:var(--ink);font-weight:700;font-size:.78rem;
  display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;min-width:0;overflow-wrap:anywhere;position:relative}
.opt img{width:44px;height:44px;object-fit:contain}
.opt.cur{border-color:var(--pink-deep);background:#ffeaf3}
.opt.cur::after{content:"いまの";position:absolute;top:-8px;right:-4px;font-size:.6rem;background:var(--pink-deep);color:#fff;border-radius:999px;padding:1px 6px}
.opt:disabled{opacity:.35;cursor:not-allowed}
.opt .tag{font-size:.6rem;color:var(--ink-soft);font-weight:500}
.opt.white{background:var(--s-white)} .opt.blue{background:var(--s-blue);color:var(--s-blue-ink)} .opt.gold{background:var(--s-gold);color:var(--s-gold-ink)}
.opt:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.sgroup{font-size:.72rem;font-weight:900;color:var(--ink-soft);margin-top:4px}
.srow{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}

/* ===== ガチャ演出 ===== */
.ov{position:fixed;inset:0;z-index:50;display:grid;place-items:center;overflow:hidden;
  background:radial-gradient(circle at 50% 45%,#fff 0%,#fff3f9 40%,#f3e4ff 100%);
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.ov[hidden]{display:none!important}
.ov::before{content:"";position:absolute;left:50%;top:50%;width:900px;height:900px;margin:-450px;border-radius:50%;pointer-events:none;
  background:repeating-conic-gradient(from 0deg,rgba(242,143,184,.12) 0 6deg,transparent 6deg 16deg);animation:spin 40s linear infinite}
.loading{display:flex;flex-direction:column;align-items:center;gap:16px;position:relative}
.loading[hidden]{display:none!important}
.ring{width:190px;height:190px;border-radius:50%;display:grid;place-items:center;position:relative;
  background:radial-gradient(circle,#fff 0 56%,#fff6d6 58%,#f7dc78 66%,#fff3c4 74%,rgba(255,243,196,0) 76%);
  animation:glow 1.1s ease-in-out infinite}
.ring::before{content:"";position:absolute;inset:14%;border-radius:50%;border:3px solid #ecd27c;box-shadow:0 0 0 2px #fff}
.ring.hot{animation:glow .35s ease-in-out infinite}
.ring.hot::after{content:"";position:absolute;inset:-34px;border-radius:50%;background:repeating-conic-gradient(rgba(240,198,74,.4) 0 7deg,transparent 7deg 20deg);animation:spin 1.6s linear infinite;z-index:-1}
.ring.max{transform:scale(1.15);transition:transform 1.8s ease-in}
@keyframes glow{50%{filter:drop-shadow(0 0 20px rgba(240,198,74,.9))}}
.thing{position:relative;z-index:1;display:grid;place-items:center;width:96px;height:96px}
.thing.wob{animation:wob 1s ease-in-out infinite}
.thing.fast{animation:wob .2s ease-in-out infinite}
@keyframes wob{0%,100%{transform:rotate(-10deg)}50%{transform:rotate(10deg) scale(1.06)}}
.seed{width:84px;height:84px}
.ball{width:78px;height:78px;border-radius:50%;transition:background .25s;
  box-shadow:inset -10px -12px 0 rgba(0,0,0,.08),inset 8px 8px 0 rgba(255,255,255,.55),0 4px 10px rgba(0,0,0,.08)}
.ball.white{background:#fff;box-shadow:inset -10px -12px 0 rgba(0,0,0,.07),inset 8px 8px 0 rgba(255,255,255,.6),0 0 0 2px #e3dadd}
.ball.blue{background:var(--s-blue-ball);box-shadow:inset -10px -12px 0 rgba(0,0,0,.1),inset 8px 8px 0 rgba(255,255,255,.5),0 0 26px 6px rgba(90,163,232,.6)}
.ball.gold{background:var(--s-gold-ball);box-shadow:inset -10px -12px 0 rgba(0,0,0,.08),inset 8px 8px 0 rgba(255,255,255,.55),0 0 34px 10px rgba(240,198,74,.75)}
.ball.pop{animation:popin .45s cubic-bezier(.2,1.6,.4,1)}
.ball.up{animation:upg .55s ease}
@keyframes popin{from{transform:scale(0)}}
@keyframes upg{0%{transform:scale(1)}40%{transform:scale(1.4);filter:brightness(1.9)}100%{transform:scale(1)}}
.nl{font-weight:900;color:#4b4b4b;letter-spacing:.02em;min-height:1.4em}
.nl span{display:inline-block;animation:dots 1.2s infinite}
.nl span:nth-child(2){animation-delay:.2s}.nl span:nth-child(3){animation-delay:.4s}
@keyframes dots{50%{opacity:.2}}
.tease{font-family:var(--f-pop);color:var(--pink-deep);font-size:1.1rem;min-height:1.5em}
.skiphint{position:absolute;bottom:calc(18px + env(safe-area-inset-bottom,0px));font-size:.72rem;color:var(--ink-soft)}
.skiphint[hidden]{display:none!important}
.whiteout{position:fixed;inset:0;background:#fff;z-index:52;pointer-events:none;opacity:0}
.flashw{position:fixed;inset:0;background:#fff;z-index:53;pointer-events:none;opacity:0}
.flashw.on{animation:fw .55s ease-out}
@keyframes fw{0%{opacity:0}25%{opacity:1}100%{opacity:0}}

.result{text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px;max-width:100%;position:relative}
.result[hidden]{display:none!important}
.burst{position:absolute;left:50%;top:40%;width:460px;height:460px;margin:-230px;border-radius:50%;pointer-events:none;z-index:-1;
  background:repeating-conic-gradient(from 0deg,rgba(242,143,184,.28) 0 8deg,transparent 8deg 22deg);animation:spin 14s linear infinite;
  -webkit-mask:radial-gradient(circle,#000 30%,transparent 70%);mask:radial-gradient(circle,#000 30%,transparent 70%)}
.result.gold .burst{background:repeating-conic-gradient(from 0deg,rgba(240,198,74,.45) 0 8deg,transparent 8deg 22deg)}
.result.blue .burst{background:repeating-conic-gradient(from 0deg,rgba(90,163,232,.3) 0 8deg,transparent 8deg 22deg)}
.result .where{font-family:var(--f-pop);font-size:.8rem;color:#fff;background:linear-gradient(90deg,var(--pink),var(--lav));border-radius:999px;padding:4px 14px;box-shadow:0 0 0 2px #fff,0 0 0 3px var(--gold)}
.result .pic{width:140px;height:140px;object-fit:contain;animation:zoom .6s cubic-bezier(.2,1.6,.4,1) both;filter:drop-shadow(0 6px 8px rgba(87,57,74,.2))}
.result .pic[hidden]{display:none!important}

<script>
(function(){
const $=id=>document.getElementById(id);
const CHARA="img/chara.png";
const IMG={"negi": "img/negi.png", "egg": "img/egg.png", "herb": "img/herb.png", "meat": "img/meat.png", "oil": "img/oil.png", "soy": "img/soy.png", "avo": "img/avo.png", "tail": "img/tail.png"};
const ING7=[
  {name:"ふといながねぎ",img:IMG.negi},{name:"とくせんエッグ",img:IMG.egg},{name:"げきからハーブ",img:IMG.herb},
  {name:"マメミート",img:IMG.meat},{name:"ピュアなオイル",img:IMG.oil},{name:"ワカクサ大豆",img:IMG.soy},{name:"つやつやアボカド",img:IMG.avo}
];
const ING8=ING7.concat([{name:"おいしいシッポ",img:IMG.tail}]);
const MAIN=["エナジーチャージS","エナジーチャージM","ゆめのかけらゲットS","食材ゲットS","げんきチャージS","げんきエールS","げんきオールS","料理チャンスS","料理パワーアップS","おてつだいサポートS","ゆびをふる","きのみバースト"];
const SUB=[
  ["きのみの数S","gold"],["おてつだいボーナス","gold"],["げんき回復ボーナス","gold"],["ゆめのかけらボーナス","gold"],
  ["リサーチEXPボーナス","gold"],["睡眠EXPボーナス","gold"],["スキルレベルアップM","gold"],["最大所持数アップL","gold"],
  ["おてつだいスピードM","blue"],["食材確率アップM","blue"],["スキル確率アップM","blue"],["スキルレベルアップS","blue"],["最大所持数アップM","blue"],
  ["おてつだいスピードS","white"],["食材確率アップS","white"],["スキル確率アップS","white"],["最大所持数アップS","white"]
].map(([name,tone])=>({name,tone}));
const TONE_LABEL={gold:"金",blue:"青",white:"白"};
const TONE_COL={white:{bg:"#f5f0f2",ink:"#6b5d63",ball:"#ffffff"},blue:{bg:"#dcecfb",ink:"#2f6aa3",ball:"#5aa3e8"},gold:{bg:"#f9e9b6",ink:"#8a6413",ball:"#f0c64a"}};
const SLOTS=[
  {id:"i10",group:"ing",lv:"Lv10",label:"食材 Lv10"},
  {id:"i30",group:"ing",lv:"Lv30",label:"食材 Lv30"},
  {id:"i60",group:"ing",lv:"Lv60",label:"食材 Lv60"},
  {id:"m",group:"main",lv:"メイン",label:"メインスキル"},
  {id:"s10",group:"sub",lv:"Lv10",label:"サブスキル Lv10"},
  {id:"s25",group:"sub",lv:"Lv25",label:"サブスキル Lv25"},
  {id:"s50",group:"sub",lv:"Lv50",label:"サブスキル Lv50"},
  {id:"s70",group:"sub",lv:"Lv70",label:"サブスキル Lv70"},
  {id:"s80",group:"sub",lv:"Lv80",label:"サブスキル Lv80"}
];
let vals={},learned=[],mode=null;
const mainLeft=()=>MAIN.filter(x=>!learned.includes(x));
const usable=s=>!(s.group==="main"&&mainLeft().length===0);
const subTakenBy=(id)=>SLOTS.filter(o=>o.group==="sub"&&o.id!==id).map(o=>vals[o.id]&&vals[o.id].name).filter(Boolean);

/* ================= BGM / 効果音 (WebAudioで生成) ================= */
const Snd=(()=>{
  let ctx=null,master=null,bus=null,nb=null,on=false,track="main",timer=null,nextT=0,step=0,loop=0;
  const mtof=m=>440*Math.pow(2,(m-69)/12);
  function init(){
    const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return false;
    ctx=new AC();master=ctx.createGain();master.gain.value=0;
    const comp=ctx.createDynamicsCompressor();comp.threshold.value=-14;comp.ratio.value=4;
    bus=ctx.createGain();bus.gain.value=.9;bus.connect(comp);comp.connect(master);master.connect(ctx.destination);
    nb=ctx.createBuffer(1,ctx.sampleRate,ctx.sampleRate);const d=nb.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
    return true;
  }
  function tone(t,m,dur,type,vol,o={}){
    const os=ctx.createOscillator(),g=ctx.createGain();os.type=type;os.frequency.setValueAtTime(mtof(m),t);
    const a=o.a||.006,rel=o.r||.1;
    g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(vol,t+a);g.gain.setValueAtTime(vol,t+Math.max(a,dur*.3));g.gain.exponentialRampToValueAtTime(0.0001,t+dur+rel);
    let n=os;if(o.cut){const f=ctx.createBiquadFilter();f.type="lowpass";f.frequency.value=o.cut;os.connect(f);n=f}
    n.connect(g);g.connect(bus);os.start(t);os.stop(t+dur+rel+.05);
  }
  function noise(t,dur,vol,hp,bp){
    const s=ctx.createBufferSource(),g=ctx.createGain(),f=ctx.createBiquadFilter();s.buffer=nb;
    f.type=bp?"bandpass":"highpass";f.frequency.value=hp;
    g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    s.connect(f);f.connect(g);g.connect(bus);s.start(t,Math.random()*.5);s.stop(t+dur+.02);
  }
  function kick(t,vol){
    const o=ctx.createOscillator(),g=ctx.createGain();o.frequency.setValueAtTime(140,t);o.frequency.exponentialRampToValueAtTime(42,t+.12);
    g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.0001,t+.22);o.connect(g);g.connect(bus);o.start(t);o.stop(t+.25);
  }
  function bell(t,m,vol){tone(t,m,.08,"sine",vol,{r:.5});tone(t,m+12,.04,"sine",vol*.35,{r:.3})}
  // メイン画面: F-G-Em-Am のワクワク進行
  const CH=[[53,57,60,64],[55,59,62,67],[52,55,59,64],[57,60,64,69]];
  const BASS=[41,43,40,45];
  const MEL=[
    [72,74,76,79,77,76,74,null],
    [74,76,79,81,79,null,74,null],
    [76,null,74,76,79,null,83,81],
    [81,79,76,74,76,null,null,null]];
  const MAIN_T={bpm:118,len:64,play(st,t,l,sd){
    const bar=Math.floor(st/16),s=st%16,ch=CH[bar];
    if(s===0)ch.forEach(m=>tone(t,m,sd*15,"triangle",.022,{a:.25,r:.4,cut:1600}));
    if([0,3,6,8,11,14].includes(s))tone(t,BASS[bar]+(s===8?12:0),sd*1.4,"square",.05,{cut:520});
    if(s%2===0){const arp=[0,1,2,3,2,3,1,2][(s/2)%8];bell(t,ch[arp]+12+(s>=8?12:0),.03)}
    if(s%2===0){const n=MEL[bar][s/2];if(n!=null&&l%2===1){tone(t,n,sd*1.6,"triangle",.055,{r:.12});tone(t,n+12,sd*1.2,"sine",.018)}}
    if(s===0||s===8||(s===10&&bar%2))kick(t,.35);
    if(s===4||s===12)noise(t,.12,.07,1400);
    if(s%4===2)noise(t,.04,.025,7000);
    if(st===62)bell(t,96,.025);
  }};
  // ガチャ画面: だんだん上がっていくドキドキ
  const GACHA_T={bpm:152,len:32,play(st,t,l,sd){
    const tr=Math.min(l,8),s=st%16;
    if(st===0)tone(t,36+tr,sd*31,"sawtooth",.035,{a:.2,r:.3,cut:420});
    if(s%4===0)kick(t,.4);
    noise(t,.03,.012+(st/32)*.03,6000);
    if(st>=24)noise(t,.06,.03+(st-24)*.008,1800);
    const pat=[60,65,67,72,77,79,84,79];tone(t,pat[st%8]+tr,sd*.8,"square",.022,{cut:2600});
    if(st%8===0)bell(t,84+tr,.03);
  }};
  const TR={main:MAIN_T,gacha:GACHA_T};
  function tick(){
    if(!ctx)return;
    const T=TR[track],sd=60/T.bpm/4;
    while(nextT<ctx.currentTime+.12){T.play(step,nextT,loop,sd);nextT+=sd;step++;if(step>=T.len){step=0;loop++}}
  }
  function startClock(){if(timer)clearInterval(timer);nextT=ctx.currentTime+.06;step=0;loop=0;timer=setInterval(tick,25)}
  return{
    get on(){return on},
    toggle(){
      if(!ctx&&!init())return false;
      on=!on;if(ctx.state==="suspended")ctx.resume();
      const t=ctx.currentTime;master.gain.cancelScheduledValues(t);master.gain.setValueAtTime(master.gain.value,t);
      master.gain.linearRampToValueAtTime(on?.8:0,t+.25);
      if(on)startClock();else setTimeout(()=>{if(!on&&timer){clearInterval(timer);timer=null}},300);
      return on;
    },
    set(name){if(track===name)return;track=name;if(on&&ctx)startClock()},
    sfx(kind,tone_){
      if(!on||!ctx)return;const t=ctx.currentTime+.01;
      if(kind==="riser"){const s=ctx.createBufferSource(),f=ctx.createBiquadFilter(),g=ctx.createGain();s.buffer=nb;s.loop=true;f.type="bandpass";f.Q.value=3;
        f.frequency.setValueAtTime(300,t);f.frequency.exponentialRampToValueAtTime(7000,t+1.8);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.25,t+1.7);g.gain.exponentialRampToValueAtTime(.0001,t+2);
        s.connect(f);f.connect(g);g.connect(bus);s.start(t);s.stop(t+2.05)}
      if(kind==="up"){[0,4,7,12].forEach((d,i)=>bell(t+i*.05,(tone_==="gold"?84:79)+d,.05))}
      if(kind==="pop"){tone(t,84,.05,"sine",.08,{r:.15})}
      if(kind==="fanfare"){
        const base=tone_==="gold"?72:tone_==="blue"?69:67;
        [0,4,7,12].forEach((d,i)=>tone(t+i*.08,base+d,.12,"square",.05,{cut:3000}));
        [0,4,7,12].forEach(d=>tone(t+.34,base+d,.9,"triangle",.05,{r:.5}));
        if(tone_==="gold")[19,24,28,31].forEach((d,i)=>bell(t+.4+i*.07,base+d,.05));
        kick(t+.34,.4);
      }
    }
  };
})();
const SPK_ON='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/><path d="M19 6a8.5 8.5 0 0 1 0 12"/></svg>';
const SPK_OFF='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M17 9l5 6M22 9l-5 6"/></svg>';
function drawSnd(){const b=$("sndBtn");b.innerHTML=Snd.on?SPK_ON:SPK_OFF;b.classList.toggle("on",Snd.on);b.setAttribute("aria-pressed",Snd.on?"true":"false");b.setAttribute("aria-label",Snd.on?"BGMを消す":"BGMをオンにする")}
$("sndBtn").onclick=()=>{Snd.toggle();drawSnd()};
drawSnd();

/* ================= 背景(光の玉・種・きらきら) ================= */
const SEED_PATH="M50 8C72 18 86 42 80 66C75 86 56 94 42 88C24 80 18 58 24 40C29 24 38 14 50 8Z";
(function sky(){
  const cv=$("sky"),cx=cv.getContext("2d");let W=0,H=0,dpr=1;
  const seedP=new Path2D(SEED_PATH);
  const R=Math.random;
  const orbs=Array.from({length:6},(_,i)=>({x:R(),y:R(),r:.25+R()*.25,c:["255,170,210","200,170,255","255,225,150"][i%3],sp:.00004+R()*.00005,ph:R()*6}));
  const seeds=Array.from({length:9},()=>({x:R(),y:R(),s:10+R()*14,v:.00012+R()*.00018,rot:R()*6,vr:(R()-.5)*.01,ph:R()*6}));
  const bubbles=Array.from({length:7},()=>({x:R(),y:R(),r:8+R()*18,v:.0001+R()*.00015,ph:R()*6}));
  const stars=Array.from({length:34},()=>({x:R(),y:R(),s:1.5+R()*3,ph:R()*6,sp:.001+R()*.002}));
  function size(){dpr=Math.min(2,window.devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;cx.setTransform(dpr,0,0,dpr,0,0)}
  function star(x,y,r){cx.beginPath();cx.moveTo(x,y-r);cx.quadraticCurveTo(x,y,x+r,y);cx.quadraticCurveTo(x,y,x,y+r);cx.quadraticCurveTo(x,y,x-r,y);cx.quadraticCurveTo(x,y,x,y-r);cx.fill()}
  function frame(t){
    cx.clearRect(0,0,W,H);
    orbs.forEach(o=>{const x=(o.x+Math.sin(t*o.sp+o.ph)*.12)*W,y=(o.y+Math.cos(t*o.sp*1.3+o.ph)*.1)*H,r=o.r*Math.max(W,H);
      const g=cx.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,`rgba(${o.c},.32)`);g.addColorStop(1,`rgba(${o.c},0)`);cx.fillStyle=g;cx.fillRect(0,0,W,H)});
    bubbles.forEach(b=>{let y=((b.y-t*b.v)%1+1)%1;const x=(b.x+Math.sin(t*.0006+b.ph)*.03)*W;y=y*(H+80)-40;
      cx.strokeStyle="rgba(255,255,255,.75)";cx.lineWidth=1.5;cx.fillStyle="rgba(230,200,255,.12)";cx.beginPath();cx.arc(x,y,b.r,0,7);cx.fill();cx.stroke();

      rr(c,bx,y+14,bw,56,28);c.fillStyle=col.bg;c.fill();if(x.tone==="gold"){c.strokeStyle="#d1a645";c.lineWidth=2;c.stroke()}
      c.beginPath();c.arc(bx+32,y+42,13,0,7);c.fillStyle=col.ball;c.fill();if(x.tone==="white"){c.strokeStyle="#cfc6ca";c.lineWidth=2;c.stroke()}
      c.fillStyle=col.ink;c.textAlign="left";c.textBaseline="middle";c.fillText(x.name,bx+58,y+44)}
    else{c.font=`700 36px ${FB}`;c.fillStyle="#d6b9c9";c.textAlign="left";c.textBaseline="middle";c.fillText("ー",px+200,y+44)}
    y+=100;
  }
  credit(c,W,H);
  return cv.toDataURL("image/png");
}
async function makeResult(s,r){

  const tone=s.group==="sub"?r.v.tone:null;skyBg(c,W,H,tone);
  c.save();c.translate(W/2,470);const rc=tone==="gold"?"240,198,74":tone==="blue"?"90,163,232":"242,143,184";
  for(let i=0;i<24;i++){c.rotate(Math.PI/12);c.beginPath();c.moveTo(0,0);c.lineTo(-40,-700);c.lineTo(40,-700);c.closePath();c.fillStyle=`rgba(${rc},.16)`;c.fill()}
  const gl=c.createRadialGradient(0,0,0,0,0,330);gl.addColorStop(0,"rgba(255,255,255,1)");gl.addColorStop(1,"rgba(255,255,255,0)");c.fillStyle=gl;c.beginPath();c.arc(0,0,330,0,7);c.fill();c.restore();
  ribbon(c,"ひらめいた!",W/2,60,48);
  c.font=`400 34px ${FP}`;const lw=c.measureText(s.label).width+40;
  rr(c,W/2-lw/2-3,203,lw+6,62,31);c.fillStyle="#d1a645";c.fill();pill(c,s.label,W/2-lw/2,206,56,"#f28fb8","#fff",`400 30px ${FP}`);
  if(s.group==="ing"){try{const im=await loadImg(r.v.img);const k=Math.min(300/im.width,300/im.height);c.drawImage(im,W/2-im.width*k/2,470-im.height*k/2,im.width*k,im.height*k)}catch(e){}}
  else if(s.group==="sub"){const col=TONE_COL[tone];c.save();c.shadowColor=tone==="white"?"rgba(0,0,0,.15)":col.ball;c.shadowBlur=60;c.beginPath();c.arc(W/2,470,120,0,7);c.fillStyle=col.ball;c.fill();c.restore();
    c.beginPath();c.arc(W/2+30,500,120,0,7);c.globalAlpha=.08;c.fillStyle="#000";c.save();c.beginPath();c.arc(W/2,470,120,0,7);c.clip();c.beginPath();c.arc(W/2+40,510,120,0,7);c.fill();c.restore();c.globalAlpha=1;
    c.beginPath();c.ellipse(W/2-40,425,34,20,-.6,0,7);c.fillStyle="rgba(255,255,255,.65)";c.fill();
    if(tone==="white"){c.beginPath();c.arc(W/2,470,120,0,7);c.strokeStyle="#e3dadd";c.lineWidth=5;c.stroke()}}
  else{const sp=new Path2D(SEED_PATH);c.save();c.translate(W/2,470);c.scale(2.6,2.6);c.translate(-50,-50);const g=c.createLinearGradient(20,10,80,90);g.addColorStop(0,"#f9c6dc");g.addColorStop(.55,"#e98bb4");g.addColorStop(1,"#f3d36e");
    c.shadowColor="rgba(240,198,74,.8)";c.shadowBlur=40;c.fillStyle=g;c.fill(sp);c.restore()}
  const name=s.group==="main"?r.v:r.v.name;
  const ink=tone?TONE_COL[tone].ink:"#d4588f";
  fitText(c,name,W-140,84,`400 {s}px ${FP}`);c.textAlign="center";c.textBaseline="middle";
  c.lineWidth=14;c.strokeStyle="#fff";c.lineJoin="round";c.strokeText(name,W/2,760);c.fillStyle=ink;c.fillText(name,W/2,760);
  if(tone){c.font=`700 30px ${FB}`;c.fillStyle=TONE_COL[tone].ink;c.fillText(TONE_LABEL[tone]+"スキル",W/2,840)}
  try{const im=await loadImg(CHARA);const h=210,w=im.width*h/im.height;c.drawImage(im,W-w-50,H-h-80,w,h)}catch(e){}
  credit(c,W,H);
  return cv.toDataURL("image/png");
}
let shotName="mew.png",shotFocus=null;
function openShot(url,name){shotFocus=document.activeElement;shotName=name;$("shotImg").src=url;$("shotMsg").textContent="";$("shot").hidden=false;$("shotSave").focus({preventScroll:true})}
function closeShot(){$("shot").hidden=true;if(shotFocus&&shotFocus.focus)shotFocus.focus({preventScroll:true})}
function toBlob(url){const [h,b]=url.split(",");const bin=atob(b),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return new Blob([u],{type:"image/png"})}
$("shotSave").onclick=async()=>{
  const url=$("shotImg").src,msg=$("shotMsg");
  try{const f=new File([toBlob(url)],shotName,{type:"image/png"});
    if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f]});msg.textContent="共有メニューを開いたよ";return}}catch(e){if(e&&e.name==="AbortError")return}
  try{const a=document.createElement("a");a.href=URL.createObjectURL(toBlob(url));a.download=shotName;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500);
    msg.textContent="保存されないときは画像を長押ししてね"}catch(e){msg.textContent="画像を長押しして保存してね"}
};
$("shotClose").onclick=closeShot;
$("shot").addEventListener("click",e=>{if(e.target.id==="shot")closeShot()});
$("camBtn").onclick=async()=>{const b=$("camBtn");b.disabled=true;try{openShot(await makeStatus(),"mew-status.png")}finally{b.disabled=false}};
$("rSave").onclick=async()=>{if(!curResult)return;openShot(await makeResult(curResult.s,curResult.r),"mew-hirameki.png")};
